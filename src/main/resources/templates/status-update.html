<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<body style="font-family: Arial, sans-serif; max-width: 520px; margin: auto;">
    <h2 th:text="${headline}">Application update</h2>
    <p>Hi <span th:text="${studentName}">there</span>,</p>
    <p>
        Your application for <b th:text="${jobTitle}">Job</b>
        at <b th:text="${companyName}">Company</b> is now
        <b th:text="${status}">STATUS</b>.
    </p>
    <p th:text="${message}">Message</p>
    <p style="color:#888;">Sent by HireBridge</p>
</body>
</html>
